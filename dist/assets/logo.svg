<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradient cho quả dứa & ánh nắng -->
    <linearGradient id="pineappleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gradient cho búp chè xanh ngọc -->
    <linearGradient id="teaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Gradient cho cuống & điểm định vị GPS -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Đổ bóng mềm cho logo -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Nền bo góc mềm mại với gradient ánh sáng -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#teaGrad)" filter="url(#softGlow)" />
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#ffffff" />
  
  <!-- Nền trong nhẹ nhàng -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="url(#pineappleGrad)" opacity="0.1" />

  <!-- Quả dứa cách điệu (Thân dưới dáng quả dứa uốn lượn hình giọt sương / đồi nương) -->
  <g transform="translate(60, 68)">
    <!-- Quả dứa vàng rực -->
    <path d="M 0,-24 C 22,-24 30,-2 28,18 C 26,34 16,42 0,42 C -16,42 -26,34 -28,18 C -30,-2 -22,-24 0,-24 Z" 
          fill="url(#pineappleGrad)" />
    
    <!-- Mắt dứa cách điệu hình mạng thoi kim cương thanh lịch -->
    <path d="M -16,-6 L 0,10 L 16,-6 M -18,12 L 0,28 L 18,12 M -8,33 L 0,41 L 8,33" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
    <path d="M 0,-18 L -14,-4 M 0,-18 L 14,-4" 
          fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />

    <!-- Điểm chạm định vị số (Digital Geo-Touch Ring ở chân quả) -->
    <ellipse cx="0" cy="41" rx="16" ry="4" fill="#047857" opacity="0.2" />
  </g>

  <!-- Búp chè vươn cao & Điểm định vị bản đồ số (GPS Marker) -->
  <g transform="translate(60, 42)">
    <!-- Lá chè bên trái -->
    <path d="M -2,0 C -18,-10 -22,-24 -16,-34 C -6,-28 -2,-12 -2,0 Z" 
          fill="url(#teaGrad)" />
    
    <!-- Lá chè bên phải -->
    <path d="M 2,0 C 18,-10 22,-24 16,-34 C 6,-28 2,-12 2,0 Z" 
          fill="url(#pinGrad)" />
    
    <!-- Búp chè chính giữa vươn lên thành hình kim định vị GPS -->
    <path d="M 0,2 C -5,-14 -10,-28 0,-40 C 10,-28 5,-14 0,2 Z" 
          fill="url(#teaGrad)" />

    <!-- Chấm sáng định vị GPS (Điểm chạm số hóa quê hương) -->
    <circle cx="0" cy="-40" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
